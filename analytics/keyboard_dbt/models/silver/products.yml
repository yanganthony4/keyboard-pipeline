version: 2

models:
  - name: products
    columns:

      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - switch
                  - keycap
                  - keyboard

      - name: title
        data_tests:
          - not_null

      - name: normalized_title
        data_tests:
          - not_null